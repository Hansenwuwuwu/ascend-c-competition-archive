# Optional template: enable via GitHub UI by copying to .github/workflows/archive-checks.yml.
# Stored outside .github/workflows so initial publication does not require workflow OAuth scope.
name: Static archive checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test publication validators
        run: python -m unittest discover -s tests -v
      - name: Check immutable sources and continuous review ledger
        run: python archives/2026-electric-power/deep_audit/check_coverage.py
      - name: Check audit report links
        run: python archives/2026-electric-power/deep_audit/check_report_links.py
      - name: Check ZIPs, PDFs, portable navigation and credential patterns
        run: python tools/archive_checks.py
